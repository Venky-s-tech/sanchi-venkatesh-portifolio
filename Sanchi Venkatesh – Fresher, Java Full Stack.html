@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6fc;--ink:#121a33;--mute:#4b5878;--card:rgba(255,255,255,.72);--line:rgba(40,60,120,.2);--acc:#c2620a;--acc2:#3b5bdb}}
:root[data-theme="light"]{--bg:#f4f6fc;--ink:#121a33;--mute:#4b5878;--card:rgba(255,255,255,.72);--line:rgba(40,60,120,.2);--acc:#c2620a;--acc2:#3b5bdb}
:root[data-theme="dark"]{--bg:#0a1020}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Syne',system-ui,sans-serif;line-height:1.05;margin:0}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,nav{position:relative;z-index:1}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 60%,transparent)}
nav b{font:800 18px 'Syne',sans-serif}nav div{display:flex;gap:22px;flex-wrap:wrap}
a{color:inherit;text-decoration:none}nav a{color:var(--mute);font-size:15px}nav a:hover,a:focus-visible{color:var(--acc);outline:none}
section{max-width:1080px;margin:0 auto;padding:110px 5vw 30px}
.hero{min-height:88vh;display:flex;align-items:center;gap:48px;flex-wrap:wrap;padding-top:60px}
.hero .t{flex:1 1 420px}
.hero h1{font-size:clamp(46px,9vw,104px);font-weight:800;letter-spacing:-.03em}
.hero p{max-width:52ch;color:var(--mute);font-size:19px;margin:22px 0 30px}
.photo{width:min(300px,70vw);aspect-ratio:1;border-radius:46% 54% 50% 50%/52% 46% 54% 48%;overflow:hidden;border:2px solid var(--acc);box-shadow:0 0 70px color-mix(in srgb,var(--acc2) 45%,transparent);animation:morph 12s ease-in-out infinite}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes morph{50%{border-radius:54% 46% 42% 58%/46% 56% 44% 54%}}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:700;margin:0 10px 10px 0;border:1px solid var(--line);transition:.2s}
.btn.p{background:var(--acc);color:#1a1205;border-color:var(--acc)}.btn:hover{transform:translateY(-2px)}
h2{font-size:clamp(32px,5vw,54px);font-weight:800;margin-bottom:34px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;backdrop-filter:blur(10px);transition:transform .15s ease-out;will-change:transform}
.card h3{font-size:22px;margin-bottom:8px}.card p{color:var(--mute);margin:8px 0 14px;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{font-size:13.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.tl{border-left:2px solid var(--acc2);padding-left:28px;margin-left:6px}
.tl li{list-style:none;margin-bottom:12px;color:var(--mute)}
.when{color:var(--acc);font-weight:700;font-size:15px}
.skill h3{font-size:19px;color:var(--acc);margin-bottom:12px}
.wide{max-width:60ch;font-size:20px;color:var(--mute)}.wide b{color:var(--ink)}
footer{text-align:center;padding:90px 5vw 70px;position:relative;z-index:1}
footer h2{margin-bottom:16px}footer p{color:var(--mute);margin:0 0 26px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.photo{animation:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
